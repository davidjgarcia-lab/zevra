name: App Android (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la app web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Preparar la firma
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zevra.keystore"
            echo "path=$RUNNER_TEMP/zevra.keystore" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "out=release/app-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin secreto ANDROID_KEYSTORE_BASE64: se genera un APK de depuración (cada versión necesitará desinstalar la anterior)."
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "out=debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK
        working-directory: android
        env:
          ZEVRA_KEYSTORE_PATH: ${{ steps.sign.outputs.path }}
          ZEVRA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZEVRA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZEVRA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew ${{ steps.sign.outputs.task }} -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/${{ steps.sign.outputs.out }} ../zevra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zevra-apk
          path: zevra.apk

      - name: Publicar en Releases (enlace de descarga fijo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ZEVRA para Android
          body: |
            Descarga **zevra.apk** e instálalo en tu Android (permite «instalar apps de origen desconocido» si te lo pide).
            Versión ${{ github.run_number }} · ${{ github.sha }}
          files: zevra.apk
          make_latest: true
